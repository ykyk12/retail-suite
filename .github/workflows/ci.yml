name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

  # 真机验证"一键起全栈"：GitHub runner 自带 Docker，所以 compose 编排在这里能被真正跑起来，
  # 而不是只做静态校验。跑通后再通过 Nginx（80 端口）打一遍端到端冒烟脚本。
  e2e:
    name: e2e (docker compose full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend 已就绪（第 $i 次探测）"
              exit 0
            fi
            sleep 5
          done
          echo "backend 未在 300 秒内就绪"
          docker compose logs --tail=200
          exit 1

      - name: Smoke test through Nginx (port 80)
        run: BASE_URL=http://127.0.0.1 bash scripts/smoke-e2e.sh

      # Windows 用户用的是 PowerShell 脚本：以前它从没在真机跑过，一跑就暴露了 4 个问题
      # （$var? 被当成变量名、PS 5.1 读不到非 2xx 的响应体、单元素 JSON 数组的 .Count、
      #   以及中文 .ps1 少了 UTF-8 BOM 会被 PS 5.1 按 GBK 读）。这里在 CI 里也跑一遍，
      # 保证它不会重新变成"从没被执行过的脚本"。
      - name: Smoke test with the Windows PowerShell script
        run: pwsh -NoProfile -File scripts/smoke-e2e.ps1 -BaseUrl http://localhost

      - name: Verify PowerShell script keeps its UTF-8 BOM
        run: |
          if ! head -c 3 scripts/smoke-e2e.ps1 | od -An -tx1 | grep -qi "ef bb bf"; then
            echo "::error::scripts/smoke-e2e.ps1 缺少 UTF-8 BOM：Windows PowerShell 5.1 会把中文按 GBK 读，导致语法错误而非友好报错"
            exit 1
          fi
          echo "BOM 正常"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
