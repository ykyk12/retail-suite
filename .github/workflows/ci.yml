name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

# 前端 job 等 frontend/ 工程落地后在这里追加（npm ci + npm run build）。
# 注意：job 级 if 不能用 hashFiles()（求值时还没 checkout，工作区是空的），
# 那样写会让整份 workflow 解析失败、连一个 job 都启动不了——这个坑已经踩过一次。
