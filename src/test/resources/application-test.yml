# 测试 profile：在基础配置之上只覆盖"必须不一样"的部分
#   1) 数据库换成 H2 内存库，避免测试污染本地 ./data 文件库、也避免测试之间互相影响
#   2) 关掉 MyBatis 的 SQL 打印，保持 CI 日志干净
#   3) 用独立的 JWT 密钥，避免测试依赖开发默认值
spring:
  datasource:
    url: jdbc:h2:mem:retail_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    secret: test-secret-for-unit-tests-only-32bytes-long
  ai:
    # 测试不连外部模型：走本地规则解析分支
    api-key: ""
