server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: retail-suite
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    # 默认 dev：H2 文件库（MODE=MySQL），clone 下来不装 MySQL 也能直接跑，数据落在 ./data
    url: jdbc:h2:file:./data/retailsuite;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      # 只跑建表：演示数据改由 DemoDataInitializer 幂等写入
      # （原来的 SQL 种子带 DELETE，会在每次新建 Spring 上下文时清掉已有数据，
      #   在测试里会造成"库存流水被删、订单还在"的假差异——已在 CI 上踩到过）
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL：上线请关闭（生产配置在 application-prod.yml）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ============================================================================
# 业务配置
# ============================================================================
app:
  jwt:
    # 生产必须用环境变量覆盖：至少 32 字节随机串
    secret: ${JWT_SECRET:retail-suite-dev-secret-please-override-in-prod-32bytes}
    # 访问令牌有效期（分钟）
    access-token-minutes: 120
    issuer: retail-suite
  inventory:
    # 库存低于该值的商品在预警列表中出现（可按商品覆盖 low_stock_threshold）
    default-low-stock-threshold: 10
    # 临期预警阈值（天）：到期日在 N 天内视为临期
    expiry-alert-days: ${EXPIRY_ALERT_DAYS:30}
    # 滞销判定天数：连续 N 天无销售视为滞销（管家巡检用）
    slow-moving-days: 30
  order:
    # 单笔订单最多几个明细行（防误操作/恶意构造）
    max-items-per-order: 200
    # 幂等键保留天数（清理任务用）
    idempotency-retention-days: 7
  security:
    # 登录防爆破：同一用户名连续失败 N 次后锁定
    login-max-fail: ${LOGIN_MAX_FAIL:5}
    # 锁定时长（秒）：连续失败滑动续期，停止尝试后自动解锁
    login-block-seconds: ${LOGIN_BLOCK_SECONDS:300}
  report:
    # 日报汇总任务执行时间（分钟粒度 cron 用 @Scheduled(cron) 配置）
    daily-summary-cron: "0 10 0 * * ?"
  steward:
    # 管家巡检：每天开门前把每个门店过一遍，生成当天的巡检日报
    inspect-cron: "${STEWARD_INSPECT_CRON:0 30 7 * * ?}"
    # 毛利异常阈值（%）：近 30 天毛利率低于它就报出来
    margin-alert-percent: 10
    # 补货建议按多少天的销量备货
    cover-days: 7
  ai:
    enabled: ${AI_ENABLED:true}
    # 留空则只走本地规则解析（离线可用）；配置后走 OpenAI 兼容协议
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: 60
    # 自然语言录入：草稿必须人工确认才落库（恒为 true，不允许配置成自动）
    require-human-confirm: true
